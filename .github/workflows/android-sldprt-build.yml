name: Android SolidWorks integration build

on:
  push:
    branches: [mobile-multiformat]
    paths:
      - "SrcCad.Mobile/**"
      - ".github/workflows/android-sldprt-build.yml"
  pull_request:
    branches: [mobile-viewer, main]
    paths:
      - "SrcCad.Mobile/**"
      - ".github/workflows/android-sldprt-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: SrcCad.Mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        if: always() && hashFiles('SrcCad.Mobile/app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: srccad-mobile-sldprt-debug
          path: SrcCad.Mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
